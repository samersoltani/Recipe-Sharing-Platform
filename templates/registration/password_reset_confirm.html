<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password | Recipe Box</title>
</head>
<body style="margin:0;background:#fdf6f0;font-family:Arial,sans-serif;color:#333;">
    <div style="max-width:440px;margin:60px auto;padding:30px;background:white;border-radius:14px;">
        <h1 style="color:#ea580c;">Choose a New Password</h1>

        {% if validlink %}
            <p>Enter your new password below.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" style="background:#ea580c;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;">
                    Change Password
                </button>
            </form>
        {% else %}
            <p>This password reset link is invalid or has expired.</p>
            <a href="{% url 'accounts:password_reset' %}" style="color:#ea580c;">
                Request a New Reset Link
            </a>
        {% endif %}
    </div>
</body>
</html>
