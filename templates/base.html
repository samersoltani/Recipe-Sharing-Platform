{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe Box{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #fdf6f0; color: #333; }

        /* Navbar */
        .navbar { background: #ea580c; padding: 14px 0; }
        .nav-container {
            width: 90%; max-width: 1000px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        .brand { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
        .nav-links form { margin: 0; }
        .nav-link { color: white; text-decoration: none; font-size: 14px; }
        .nav-link:hover { text-decoration: underline; }
        .nav-btn {
            display: inline-block; background: transparent; color: white;
            border: 1px solid rgba(255,255,255,0.7); padding: 6px 14px;
            border-radius: 8px; font-size: 14px; font-family: inherit;
            text-decoration: none; cursor: pointer;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.15); }
        .nav-btn-solid { background: white; color: #ea580c; border-color: white; }
        .nav-btn-solid:hover { background: #fff1e6; }

        /* Layout */
        .container { width: 90%; max-width: 1000px; margin: 40px auto; }

        /* Buttons */
        .btn { text-decoration: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; border: none; cursor: pointer; display: inline-block; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #ea580c; color: white; }
        .btn-secondary { background: #e5e7eb; color: #333; }
        .btn-danger { background: #dc2626; color: white; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 15px; font-family: inherit;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'recipes:recipes_list' %}" class="brand">Recipe Box</a>

            <div class="nav-links">
                <a href="{% url 'recipes:recipes_list' %}" class="nav-link">All recipes</a>

                {% if user.is_authenticated %}
                        <a href="{% url 'accounts:profile' %}" class="nav-link">Hi,{{ user.username }}</a>
                    <form action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="nav-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="nav-link">Login</a>
                    <a href="{% url 'accounts:signup' %}" class="nav-btn nav-btn-solid">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
